name: social tick

# Vercel's Hobby plan only runs cron once a day, which is too coarse to hit a
# posting slot, so the schedule lives here and Vercel just does the work.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the site to check the posting queue
        run: |
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://luminavisual.co.il/api/social-cron)
          cat /tmp/body
          echo
          if [ "$code" != "200" ]; then
            echo "tick failed with HTTP $code"
            exit 1
          fi
